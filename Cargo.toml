[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/decode", "crates/engine", "crates/analysis", "crates/io", "crates/layout", "crates/shell", "crates/stretch", "crates/ui", "crates/net", "crates/port/engine", "crates/port/stretch", "crates/port/control", "crates/port/timecode", "crates/port/separation", "crates/port/plugin-host", "crates/port/plugin-host/test-plugin", "crates/port/plugin-host/test-vst3", "crates/port/link", "crates/port/third_party/demucs-core"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
