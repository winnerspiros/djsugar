[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/decode", "crates/engine", "crates/analysis", "crates/io", "crates/layout", "crates/shell", "crates/stretch", "crates/ui", "crates/net", "crates/port/engine", "crates/port/stretch", "crates/port/control", "crates/port/controllers", "crates/port/script", "crates/port/js", "crates/port/hid", "crates/port/spotify", "crates/port/timecode", "crates/port/separation", "crates/port/plugin-host", "crates/port/plugin-host/test-plugin", "crates/port/plugin-host/test-vst3", "crates/port/link", "crates/port/third_party/demucs-core"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Optimized tests in CI without the slow whole-program link of release.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Code that talks to servers or reads a script once is built small: it waits on the network or runs at load, so its
# speed is not heard, and it is a large share of the binary. Sound, drawing and ciphers keep the full optimization.
[profile.release.package]
djsugar-spotify.opt-level = "s"
librespot-core.opt-level = "s"
librespot-metadata.opt-level = "s"
librespot-protocol.opt-level = "s"
protobuf.opt-level = "s"
protobuf-json-mapping.opt-level = "s"
protobuf-support.opt-level = "s"
quick-xml.opt-level = "s"
governor.opt-level = "s"
sysinfo.opt-level = "s"
futures-timer.opt-level = "s"
h2.opt-level = "s"
http-body.opt-level = "s"
http-body-util.opt-level = "s"
hyper.opt-level = "s"
hyper-rustls.opt-level = "s"
hyper-util.opt-level = "s"
tokio.opt-level = "s"
tokio-rustls.opt-level = "s"
tokio-stream.opt-level = "s"
tokio-tungstenite.opt-level = "s"
tokio-util.opt-level = "s"
tungstenite.opt-level = "s"
rustls.opt-level = "s"
rustls-webpki.opt-level = "s"
webpki-roots.opt-level = "s"
boa_parser.opt-level = "s"
boa_ast.opt-level = "s"
boa_interner.opt-level = "s"

# librespot-core 0.8.0 with changes marked "DJ Sugar": TLS in pure Rust, Android reports as Linux, audio key refusals
# keep their code, an account without Premium no longer ends the app, and the build reads no git or clock.
[patch.crates-io]
librespot-core = { path = "crates/port/spotify/vendor/librespot-core" }
