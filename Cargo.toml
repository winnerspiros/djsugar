[workspace]
resolver = "2"
members = ["crates/control", "crates/engine", "crates/controllers", "crates/waveform", "crates/library", "crates/export", "crates/plugins", "crates/plugin-host", "crates/plugin-host/test-plugin", "crates/plugin-host/test-vst3", "crates/separation", "third_party/demucs-core", "crates/stem-bench", "crates/phrase-bench", "crates/analysis-bench", "crates/script", "crates/remote", "crates/osc", "crates/link", "crates/stretch", "crates/hid", "crates/timecode", "crates/mods", "crates/js", "crates/broadcast", "crates/app", "crates/android"]
exclude = ["third_party"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-2.0-or-later"

# Lints for every crate (each has `lints.workspace = true`; not `todo`, which Slint's generated code uses): only ones the
# code already passes. Candidates for later: docs/dev/clippy-pedantic-triage.md.
[workspace.lints.clippy]
dbg_macro = "deny"

# What releases ship: whole-program optimisation and one codegen unit.
# Panics still unwind; stem separation and word timing recover from them.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Decoding, analysis and synthesis are far too slow unoptimised, even in tests.
# Phones: as small as it can be without slowing the audio. Link-time
# optimisation across every crate drops unused code, symbols are stripped,
# other people's code is built for size, and the audio and analysis code
# stays built for speed. Unwinding stays: model crashes are caught.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.android.package."*"]
opt-level = "s"

[profile.android.package.djsugar-engine]
opt-level = 3

[profile.android.package.djsugar-stretch]
opt-level = 3

[profile.android.package.djsugar-separation]
opt-level = 3

[profile.android.package.djsugar-js]
opt-level = 3

[profile.android.package.symphonia-core]
opt-level = 3

[profile.android.package.symphonia-bundle-mp3]
opt-level = 3

[profile.android.package.symphonia-bundle-flac]
opt-level = 3

[profile.android.package.rubato]
opt-level = 3

[profile.android.package.demucs-core]
opt-level = 3

[profile.android.package.burn-flex]
opt-level = 3

[profile.android.package.gemm-f32]
opt-level = 3

[profile.android.package.matrixmultiply]
opt-level = 3

[profile.android.package.rten]
opt-level = 3

[profile.android.package.rten-tensor]
opt-level = 3

[profile.android.package.rten-simd]
opt-level = 3

[profile.android.package.rten-vecmath]
opt-level = 3

[profile.android.package.rten-gemm]
opt-level = 3

[profile.android.package.beat-this]
opt-level = 3

[profile.dev.package.djsugar-engine]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2

[profile.dev.package.symphonia-bundle-flac]
opt-level = 2

[profile.dev.package.djsugar-separation]
opt-level = 2

[profile.dev.package.djsugar-js]
opt-level = 3

[profile.dev.package.djsugar-stretch]
opt-level = 3

[profile.dev.package.demucs-core]
opt-level = 2

[profile.dev.package.burn-flex]
opt-level = 2

[profile.dev.package.gemm-f32]
opt-level = 2

[profile.dev.package.matrixmultiply]
opt-level = 2

# Beat This!'s runtime: unoptimised, a track takes minutes instead of seconds.
[profile.dev.package.rten]
opt-level = 2

[profile.dev.package.rten-tensor]
opt-level = 2

[profile.dev.package.rten-simd]
opt-level = 2

[profile.dev.package.rten-vecmath]
opt-level = 2

[profile.dev.package.rten-gemm]
opt-level = 2

[profile.dev.package.rten-base]
opt-level = 2

[profile.dev.package.beat-this]
opt-level = 2

[profile.dev.package.rubato]
opt-level = 2

# femtovg (Slint's renderer) with a fix for its pipeline cache, which threw
# away pipelines each flush and rebuilt them every frame. See
# third_party/femtovg/DJSUGAR.md.
[patch.crates-io]
femtovg = { path = "third_party/femtovg" }
# Lets the winit backend with the wgpu FemtoVG renderer run on Android
# (upstream allows only the Skia-based android-activity backend there).
slint = { path = "third_party/slint" }
i-slint-backend-selector = { path = "third_party/i-slint-backend-selector" }
i-slint-backend-winit = { path = "third_party/i-slint-backend-winit" }
# fp16 enabled on its aarch64 half-precision asm, which newer LLVM rejects
# without it.
gemm-common = { path = "third_party/gemm-common" }
# Linux/BSD fonts found by scanning the font directories, without fontconfig.
fontique = { path = "third_party/fontique" }
