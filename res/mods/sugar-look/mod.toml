# DJ Sugar's own look: neon glaze pink on warm plum black, with the
# sprinkle colours for the decks. It loads like any other mod, so a mod of
# your own can change any of it: copy this folder into the mods folder in
# DJ Sugar's settings folder and edit it, or require "sugar.look" and set
# only what you want different.
id = "sugar.look"
name = "Sugar"
version = "1.0.0"
description = "DJ Sugar's own look: glaze pink on plum black"
author = "DJ Sugar"

[contributes.theme.dark]
background = "#0e0a10"
panel = "#18121b"
panel-raised = "#221a26"
browser = "#110c13"
row = "#150f17"
row-alt = "#110c13"
control = "#160f18"
control-pressed = "#2c2130"
border = "#3a2b3e"
separator = "#2a1f2d"
edge = "#000000"
text = "#f6eef6"
text-dim = "#9a8c9e"
label = "#a395a6"
knob = "#1b141d"
knob-rim = "#4d3a52"
knob-arc = "#ff2e93"
knob-ring = "#3a2b3e"
lilac = "#ff4fa3"
lilac-text = "#ff6fb3"
lilac-dim = "#ff4fa399"
selection = "#ff2e93"
on-selection = "#1a0b17"
key = "#ff8fc7"
wave-well = "#0b070d"
well = "#0b070d"
deck1 = "#ff2e93"
deck2 = "#5fd3ff"
deck3 = "#c6ff6b"
deck4 = "#fff27a"

[contributes.theme.light]
background = "#f3e9ef"
panel = "#fbf5f8"
border = "#d9c6d1"
separator = "#e6d6df"
knob-arc = "#e0217f"
lilac = "#e0217f"
lilac-text = "#c41a6e"
lilac-dim = "#e0217f99"
selection = "#e0217f"
key = "#c41a6e"
deck1 = "#e0217f"
deck2 = "#0b8fc4"
deck3 = "#4c9a00"
deck4 = "#b89400"
