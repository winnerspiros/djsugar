name: Android

# Builds every crate for Android arm64 with the NDK on the runner, one job per
# crate so each crate's state shows on its own.

on:
  push:
    branches: [rust]
    paths-ignore: ["docs/**", "openspec/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate:
          - djsugar-control
          - djsugar-engine
          - djsugar-controllers
          - djsugar-library
          - djsugar-plugins
          - djsugar-broadcast
          - djsugar-export
          - djsugar-osc
          - djsugar-remote
          - djsugar-script
          - djsugar-separation
          - djsugar-waveform
          - djsugar-android
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/rust' }}
          cache-on-failure: true
      - run: cargo install cargo-ndk --locked
      - name: cargo ndk check
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 29 check -p ${{ matrix.crate }} --locked

  apk:
    # An installable APK of the whole app, attached to the run: sideload it
    # (adb install, or open it on the phone) to try DJ Sugar on Android.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
          save-if: ${{ github.ref == 'refs/heads/rust' }}
          cache-on-failure: true
      - run: cargo install cargo-ndk --locked
      - name: Package
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          PROFILE=release scripts/package-android.sh "0.6.0-${GITHUB_SHA::7}"
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-android-apk
          path: dist/*.apk

  launch:
    # Starts the APK on an emulator and fails unless it draws: a screenshot
    # and the log are attached to the run either way.
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: djsugar-android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/android-launch-check.sh apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-launch
          path: launch/
