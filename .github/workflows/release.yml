name: Release

# Pushing a tag such as v0.1.0 builds the macOS, Linux and Windows downloads and
# publishes them as a GitHub release. On a pull request that changes the
# packaging, the same builds run without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-*
      - res/windows/**
      - res/macos/djsugar.entitlements
  workflow_dispatch:

# A new push to a pull request cancels the packaging run for the push before it.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # The app reports the Cargo.toml version (Settings, bug reports,
          # update checks) and the downloads are named after the tag, so a
          # tag that doesn't match would ship an app that disagrees with
          # itself and keeps offering its own release as an update.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $cargo in Cargo.toml. Merge the prepare PR that bumps it, then tag again."
            exit 1
          fi
          echo "version=$cargo" >> "$GITHUB_OUTPUT"

  macos-build:
    # Each chip builds on its own runner at once; `macos` joins them into one
    # app. Fat LTO on one runner after the other took over two hours.
    needs: version
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: |
          # whisper.cpp's Metal code checks the macOS version with
          # @available, whose helper lives in clang's runtime library.
          export RUSTFLAGS="-C link-arg=$(clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          cargo build --profile dist -p djsugar -p djsugar-plugin-host --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/dist/djsugar target/${{ matrix.target }}/dist/djsugar-plugin-host out/
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.target }}
          path: out/
          retention-days: 1

  macos:
    # One app for both Apple Silicon and Intel Macs.
    # Signed with the project's Developer ID and notarized when the secrets below
    # are set (see docs/macos-signing.md); otherwise ad-hoc signed as before.
    needs: [version, macos-build]
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
      - run: |
          mkdir -p dist
          for bin in djsugar djsugar-plugin-host; do
            lipo -create -output dist/$bin macos-aarch64-apple-darwin/$bin macos-x86_64-apple-darwin/$bin
            chmod +x dist/$bin
          done
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - run: scripts/bundle-macos.sh dist/djsugar "${{ needs.version.outputs.version }}"
      - name: Notarize
        if: env.MACOS_SIGN_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool submit dist/djsugar-macos.zip --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          # Staple the ticket so the app opens offline too, then zip it again.
          # Apple's ticket server can lag or drop the connection, so retry.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple dist/DJSugar.app && break
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          rm dist/djsugar-macos.zip
          (cd dist && ditto -c -k --keepParent DJSugar.app djsugar-macos.zip)
      - run: |
          v="${{ needs.version.outputs.version }}"
          mv dist/djsugar-macos.zip "dist/DJSugar-$v-macos.zip"
          # A disk image too, with Applications beside the app to drag it to.
          mkdir dist/dmg
          ditto dist/DJSugar.app dist/dmg/DJSugar.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "DJ Sugar" -srcfolder dist/dmg -ov -format UDZO "dist/DJSugar-$v-macos.dmg"
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --sign "$MACOS_SIGN_IDENTITY" --timestamp "dist/DJSugar-$v-macos.dmg"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/DJSugar-*-macos.zip
            dist/DJSugar-*-macos.dmg

  linux:
    # Built on the oldest supported Ubuntu, so the binary runs on any distro
    # with glibc 2.35 or newer.
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libasound2-dev cmake libclang-dev imagemagick rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist -p djsugar -p djsugar-plugin-host
      - run: scripts/bundle-linux.sh target/dist/djsugar "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  windows:
    # A setup .exe (per-user, no admin) and a portable zip, for x64 PCs and
    # for Windows on Arm (built natively, as the ASIO and audio C code need
    # the ARM64 compiler). Unsigned until a code signing certificate is set
    # up (docs/windows.md).
    needs: version
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # C/C++ dependencies (whisper.cpp) keep the compiler's path in their
      # build cache; a new runner image moves the compiler, so each image
      # gets its own cache.
      - run: echo "IMAGE=$ImageVersion" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}-image-${{ env.IMAGE }}
          cache-on-failure: true
      # cpal's ASIO build unpacks Steinberg's SDK with PowerShell, which
      # fails on newer runner images; unpack it here and point it there.
      - run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/asio.zip" https://www.steinberg.net/asiosdk
          unzip -q -o "$RUNNER_TEMP/asio.zip" -d "$RUNNER_TEMP/asio"
          dir=$(dirname "$(find "$RUNNER_TEMP/asio" -type d -name common | head -n1)")
          echo "CPAL_ASIO_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
        shell: bash
      # whisper.cpp builds for ARM only with clang, not MSVC: Ninja and
      # clang-cl in the ARM64 developer environment.
      - if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - if: matrix.arch == 'arm64'
        run: |
          pip install ninja
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "CC_aarch64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
          echo "CXX_aarch64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
          echo "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" >> "$GITHUB_ENV"
        shell: bash
      - run: cargo build --profile dist -p djsugar -p djsugar-plugin-host
      - run: scripts/bundle-windows.ps1 target/dist/djsugar.exe "${{ needs.version.outputs.version }}" ${{ matrix.arch }}
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-setup.exe

  publish:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: DJ Sugar ${{ needs.version.outputs.version }}
          body_path: docs/release-notes.md
          # Adds the list of merged pull requests (grouped by .github/release.yml)
          # under the hand-written notes.
          generate_release_notes: true
          # A tag such as v0.2.0-beta.1 makes a pre-release, for testers;
          # the README's download link skips those.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
