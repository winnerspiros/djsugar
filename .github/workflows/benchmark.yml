# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Ubuntu 24.04 Benchmark
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          # This is necessary for making `git describe` work.
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        # Works around an issue where not the latest tag is not fetched when the
        # workflow is triggered by a tag push event.
        # Possibly related: actions/checkout#290
        run: git fetch origin --force --tags

      - name: "[Ubuntu] Install build dependencies"
        run: tools/debian_buildenv.sh setup

      - name: "[Ubuntu/macOS] Restore ccache cache"
        # Reuse the ccache saved by build.yml, which compiles the same sources
        # with the same flags. Never save: the benchmark would only store a
        # duplicate of the build cache.
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ubuntu-qt6-${{ inputs.branch }}
          restore-keys: |
            ubuntu-qt6-${{ inputs.branch }}
            ubuntu-qt6-${{ github.base_ref }}
            ubuntu-qt6

      - name: "[Ubuntu/macOS] Set up ccache"
        # GitHub Actions gives us 10 GB of cache.
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: "Create build directory"
        run: mkdir build

      - name: "Configure"
        run: >-
          cmake
          -DQT6=ON
          -DQML=ON
          -DBULK=ON
          -DFFMPEG=ON
          -DLOCALECOMPARE=ON
          -DMAD=ON
          -DMODPLUG=ON
          -DWAVPACK=ON
          -DINSTALL_USER_UDEV_RULES=OFF
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          -DWARNINGS_FATAL=ON
          -DDEBUG_ASSERTIONS_FATAL=OFF
          -DBATTERY=ON
          -DBROADCAST=ON
          -DDOWNLOAD_MANUAL=ON
          -DHID=ON
          -DKEYFINDER=ON
          -DLILV=ON
          -DOPUS=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
          -DCMAKE_VERBOSE_MAKEFILE=OFF
          -L
          ..
        working-directory: build

      - name: "[Ubuntu/macOS] Set up gcc/clang problem matcher"
        run: echo "::add-matcher::.github/gcc-matcher.json"

      - name: Benchmark
        run: |
          cmake --build . --config RelWithDebInfo --target mixxx-benchmark --parallel "$(nproc)"
          ctest --timeout 45 -R Benchmark
        working-directory: build
        env:
          GTEST_COLOR: 1
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
