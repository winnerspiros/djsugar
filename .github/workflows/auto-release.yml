# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
# Publishes DJ Sugar builds to GitHub Releases.
#
#   - Push to main: pre-release v2.7-alpha-<hash>.
#   - Version tag (vX.Y.Z) or manual run: versioned release.
#
# build.yml builds every platform (its own matrix; do not wrap it in another
# one). The release job attaches APK, IPA, MSI x2, DMG x2, DEB and AppImage.

name: Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    paths:
      - "src/**"
      - "res/**"
      - "tools/**"
      - "packaging/**"
      - "CMakeLists.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Release version (e.g. v2.7.0). Leave empty to auto-detect from git
          describe.
        required: false
        default: ""
      prerelease:
        description: Mark as pre-release?
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: auto-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create/update GitHub Releases

jobs:
  # ── 1. Determine the version string used everywhere ──────────────────────
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      release_name: ${{ steps.ver.outputs.release_name }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history for git describe

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail

          # Priority 1: explicit manual input
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          # Priority 2: pushed version tag
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
          # Priority 3: short nightly version.
          #
          # CRITICAL: We use a FIXED base version (v2.7-alpha) plus the
          # short commit hash. Do NOT use git describe to find the nearest
          # tag, because previous auto-release runs created tags that
          # themselves contain full git-describe output, causing the tag
          # name to grow indefinitely and exceed GitHub's 255-byte ref
          # limit.
          else
            SHORT_HASH="$(git rev-parse --short HEAD)"
            VER="v2.7-alpha-${SHORT_HASH}"
          fi

          # Strip a leading 'v' for display; keep it in the tag name.
          TAG="$VER"
          [[ "$TAG" == v* ]] || TAG="v${TAG}"
          DISPLAY="${TAG#v}"

          # A release is a pre-release when it contains '-' after the semver
          # core (e.g. "2.7.0-alpha") OR when it is a nightly/git-describe
          # build (contains 'g' from git-describe or 'dev-').
          IS_PRE="false"
          if [[ "$DISPLAY" == *"-"* ]] || [[ "$DISPLAY" == *"g"* ]]; then
            IS_PRE="true"
          fi
          # Manual override wins.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IS_PRE="${{ github.event.inputs.prerelease }}"
          fi

          echo "version=${DISPLAY}"      >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "release_name=DJ Sugar ${DISPLAY}" >> "$GITHUB_OUTPUT"

          echo "Version : ${DISPLAY}"
          echo "Tag     : ${TAG}"
          echo "PreRelease: ${IS_PRE}"

  # ── 2. Build every platform via the reusable build workflow ───────────────
  #
  # NOTE: build.yml has its own internal matrix for the 6 build platforms.
  # Do NOT wrap this in a second matrix here — that would create a
  # cartesian product (6 × 6 = 36 jobs) and burn through runners.
  build:
    name: Build
    needs: version
    permissions:
      contents: read #  to fetch code (actions/checkout)
      actions: write # to delete outdated caches
    uses: ./.github/workflows/build.yml
    with:
      publish: false
      branch: ${{ github.head_ref || github.ref_name }}
      ref: ${{ github.ref }}

  # ── 3. Publish GitHub Release ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    # Run even if some builds fail so we still get a release with partial assets.
    if: always() && needs.version.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the history since the last release

      # Download artifacts from each build by slug name (build.yml uses
      # artifacts_slug as the upload-artifact name).
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: "*-*"
          merge-multiple: false

      # Flatten — each artifact is in its own sub-directory.
      - name: Flatten artifact directories
        run: |
          mkdir -p flat-assets
          find release-assets -type f \( -name "*.deb" -o -name "*.dmg" -o -name "*.msi" -o -name "*.apk" -o -name "*.ipa" -o -name "*.AppImage" \) -exec mv {} flat-assets/ \;
          ls -lh flat-assets/

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag_name }}
        run: |
          # Previous published release, not counting the one being (re)made
          PREV=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName,isDraft \
            -q "[.[] | select(.isDraft | not) | select(.tagName != \"$TAG\")][0].tagName // \"\"")
          git rev-parse -q --verify "refs/tags/$PREV" >/dev/null || PREV=""
          python3 tools/release_notes.py "$PREV" "$GITHUB_SHA" "$GITHUB_REPOSITORY" flat-assets > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: ${{ needs.version.outputs.release_name }}
          prerelease: ${{ needs.version.outputs.is_prerelease }}
          draft: false
          body_path: notes.md
          files: flat-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
