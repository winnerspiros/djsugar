name: CI

# Pull requests run the Linux checks (format, clippy, tests), the dependency
# check, and the macOS app build so each pull request can be tried on a Mac.
# The Windows checks and the Windows app build run after a merge to main, or
# for any branch from the Actions tab (Run workflow).
# A merge queue (merge_group) would run the same Linux checks and the
# dependency check on the pull request rebased on the latest main, skipping
# the app builds, which run again after the merge. GitHub offers merge
# queues only to repositories owned by an organization, so this waits for
# that.
# Releases build every platform in release.yml.
on:
  push:
    branches: [main, rust]
    paths-ignore: ["website/**", "docs/**", "openspec/**", "**/*.md"]
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push cancels the run for the push before it: only the newest counts.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Pull requests that only touch docs skip the checks below. Skipping them
    # here instead of with paths-ignore lets them report as passed, so a
    # docs-only pull request isn't left waiting on required checks.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.code == 'true' }}
    steps:
      # The merge queue has no pull request to ask for its files, so it
      # compares the queued commit with the main it was rebased on.
      - uses: actions/checkout@v7
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          base: ${{ github.event.merge_group.base_sha }}
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!website/**"
              - "!docs/**"
              - "!openspec/**"
              - "!**/*.md"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # Line tables only: full debug info for the whole workspace fills the
      # runner's disk and memory while linking the test binaries.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space, add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a && sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
      - name: Install system libraries
        # mesa-vulkan-drivers provides lavapipe, a software Vulkan driver, so the
        # waveform shader test runs on CI machines without a GPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libasound2-dev mesa-vulkan-drivers mold
      - name: Fetch rekordbox demo libraries
        # rbox's demo master.db files, for the rekordbox import and export
        # tests (test data only; nothing from it is built in).
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/dylanljones/rbox "$RUNNER_TEMP/rbox"
          git -C "$RUNNER_TEMP/rbox" sparse-checkout set .testdata/RBv6/demo .testdata/RBv7/demo
          echo "RBOX_TESTDATA=$RUNNER_TEMP/rbox/.testdata" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --exclude djsugar --all-targets -- -D warnings
      - run: cargo clippy -p djsugar --all-targets -j1 -- -D warnings
      # Includes the check that docs/supported-controls.txt matches
      # `djsugar --list-controls` (control_list_tests in crates/app).
      # The app crate (its generated UI is one very large compile) builds on
      # its own after the rest; together they exhaust the runner's memory.
      # Each test step repeats its build step's crate set, so nothing is
      # rebuilt.
      - run: cargo test --workspace --exclude djsugar --no-run -j2
        timeout-minutes: 40
      # Before the app's build, the heaviest step, so these results come in
      # even when that build starves the runner.
      - run: cargo test --workspace --exclude djsugar -- --test-threads=2
        timeout-minutes: 30
      # Capped below the runner's memory: past that, the build is stopped
      # with an error here instead of the runner losing its connection.
      - run: systemd-run --user --wait --pipe --same-dir -p MemoryMax=13G -p MemorySwapMax=8G --setenv=PATH --setenv=CARGO_PROFILE_DEV_DEBUG --setenv=CARGO_PROFILE_TEST_DEBUG --setenv=CARGO_INCREMENTAL --setenv=RUSTFLAGS --setenv=CARGO_HOME --setenv=RUSTUP_HOME --setenv=CARGO_TERM_COLOR cargo test -p djsugar --no-run -j1
        timeout-minutes: 40
      - run: cargo test -p djsugar -- --test-threads=2
        timeout-minutes: 20

  fmt:
    # Seconds, so a formatting slip shows before the long jobs finish.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  windows:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # Windows ships as a preview: the crates with platform code are tested
    # there. The app is built by windows-app, and linted and tested on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # C/C++ dependencies (whisper.cpp) keep the compiler's path in their
      # build cache; a new runner image moves the compiler, so each image
      # gets its own cache.
      # cpal's ASIO build unpacks Steinberg's SDK with PowerShell, which
      # fails on newer runner images; unpack it here and point it there.
      - run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/asio.zip" https://www.steinberg.net/asiosdk
          unzip -q -o "$RUNNER_TEMP/asio.zip" -d "$RUNNER_TEMP/asio"
          dir=$(dirname "$(find "$RUNNER_TEMP/asio" -type d -name common | head -n1)")
          echo "CPAL_ASIO_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
        shell: bash
      - run: echo "IMAGE=$ImageVersion" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-${{ env.IMAGE }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
          cache-on-failure: true
      - run: cargo test --workspace --exclude djsugar
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"

  dependencies:
    # Known vulnerabilities in dependencies, and licences that can't ship in a
    # GPL app (see deny.toml). Also checks for unused dependencies (cargo-machete).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete crates

  macos-app:
    # Builds an unsigned DJSugar.app for Apple Silicon and attaches it to the run,
    # so the app can be tried without installing Rust.
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: macos-15
    # GitHub is short of Apple Silicon runners at times, and a job no runner
    # picks up within 15 minutes is cancelled ("not acquired by Runner"),
    # which failed the whole run on main. The job still shows red when it
    # fails, but no longer fails the run; release.yml builds the shipped app.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # C/C++ dependencies (whisper.cpp) keep the compiler's path in their
      # build cache; a new runner image moves the compiler, so each image
      # gets its own cache.
      - run: echo "IMAGE=$ImageVersion" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-${{ env.IMAGE }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
          cache-on-failure: true
      - run: cargo build --release -p djsugar -p djsugar-plugin-host
      # The version in Cargo.toml (what the app reports in Settings), with
      # the commit as the build, so About DJ Sugar says which build this is.
      - run: scripts/bundle-macos.sh target/release/djsugar "" "test build $(git rev-parse --short HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-macos
          path: dist/djsugar-macos.zip
      # The desktop layout as it opens: a screenshot behind the welcome
      # and one after Escape, to look at with each change to the design.
      - name: Desktop screenshots
        run: |
          mkdir -p shots
          target/release/djsugar > shots/log.txt 2>&1 &
          sleep 25
          screencapture -x shots/desktop.png
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 3
          screencapture -x shots/desktop-main.png
          kill %1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-screens
          path: shots/

  windows-app:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # The Windows setup and portable zip, attached to the run so the app can
    # be tried in a Windows VM without installing Rust.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # whisper.cpp's CMake cache keeps the compiler's full path in the
      # build cache; a new runner image moves the compiler, so each image
      # gets its own cache.
      # cpal's ASIO build unpacks Steinberg's SDK with PowerShell, which
      # fails on newer runner images; unpack it here and point it there.
      - run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/asio.zip" https://www.steinberg.net/asiosdk
          unzip -q -o "$RUNNER_TEMP/asio.zip" -d "$RUNNER_TEMP/asio"
          dir=$(dirname "$(find "$RUNNER_TEMP/asio" -type d -name common | head -n1)")
          echo "CPAL_ASIO_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
        shell: bash
      - run: echo "IMAGE=$ImageVersion" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-${{ env.IMAGE }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
          cache-on-failure: true
      - run: cargo build --release -p djsugar -p djsugar-plugin-host
      # The version in Cargo.toml, as the app reports it, so the setup and
      # Apps & features name the same version.
      - run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          scripts/bundle-windows.ps1 target/release/djsugar.exe $v
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
