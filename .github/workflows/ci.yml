name: CI

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  check:
    name: check (hygiene, typos, fmt, deny, shear, lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear
      - run: scripts/hygiene.sh
      - uses: crate-ci/typos@v1.52.2
      - run: cargo fmt --all --check
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo deny --all-features check
      - run: cargo shear

  linux:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D clippy::all
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo build --release -p djsugar --locked
      - name: Every view at seven sizes, typing, focus loss, GPU recreation
        run: |
          sudo apt-get update -q && sudo apt-get install -yq mesa-vulkan-drivers
          cargo run --release --locked -p djsugar --example shots -- shots
      - if: always()
        name: Frame times to the summary
        run: cat shots/perf.md >> $GITHUB_STEP_SUMMARY || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: djsugar-screens
          path: shots
      - name: Size
        run: |
          f=target/release/djsugar
          s=$(stat -c %s $f)
          echo "Linux binary: $((s / 1024)) KiB" >> $GITHUB_STEP_SUMMARY
          [ $s -lt 41943040 ] || { echo "::error::Linux binary over 40 MiB: $s"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-linux
          path: target/release/djsugar

  miri:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --locked -p sugar-core -p sugar-layout
        env:
          RUSTFLAGS: ""

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/djsugar.exe
          - os: macos-latest
            bin: target/release/djsugar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D clippy::all
      - run: cargo test --workspace --locked
      - run: cargo build --release -p djsugar --locked
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-${{ runner.os }}
          path: ${{ matrix.bin }}

  ios:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target aarch64-apple-ios -p djsugar --locked -- -D clippy::all
      - run: cargo build --release --target aarch64-apple-ios -p djsugar --lib --locked

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - run: cargo clippy --target aarch64-linux-android -p djsugar --locked -- -D clippy::all
      - name: Build
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -z "$KEY" ] || base64 -d <<< "$KEY" > "$RUNNER_TEMP/debug.keystore"
          KEYSTORE=$RUNNER_TEMP/debug.keystore bash platform/android/build.sh
      - name: Verify and size
        run: |
          bt=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $bt/zipalign -c -P 16 4 target/djsugar.apk
          $bt/apksigner verify target/djsugar.apk
          s=$(stat -c %s target/djsugar.apk)
          so=$(stat -c %s target/android/lib/arm64-v8a/libdjsugar.so)
          echo "APK: $((s / 1024)) KiB, native lib: $((so / 1024)) KiB" >> $GITHUB_STEP_SUMMARY
          [ $s -lt 25165824 ] || { echo "::error::APK over 24 MiB: $s"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-android
          path: target/djsugar.apk

  emulator:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: x86_64 APK for the emulator
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          TARGET=x86_64-linux-android ABI=x86_64 KEYSTORE=$RUNNER_TEMP/k.keystore bash platform/android/build.sh
      - name: Launch, rotate, tap, type, background and resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash platform/android/smoke.sh target/djsugar.apk emu
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: djsugar-emulator
          path: emu

  coverage:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --summary-only | tee cov.txt
      - name: Coverage to the summary
        run: |
          echo '### Line coverage per file' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cov.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  sanitize:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: AddressSanitizer over the engine, DSP and decoders
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --locked
          -p sugar-core -p sugar-engine -p sugar-decode -p sugar-stretch -p sugar-analysis -p sugar-layout

  optimize:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat
      - name: Pedantic, nursery and perf lints as hints
        env:
          RUSTFLAGS: ""
        run: |
          cargo clippy --workspace --all-targets --locked --message-format short -- \
            -W clippy::pedantic -W clippy::nursery 2>&1 | grep -E '^[a-z/]+.*(warning|error)' > lints.txt || true
          echo "### Optimisation hints: $(wc -l < lints.txt)" >> $GITHUB_STEP_SUMMARY
          grep -oE '\[clippy::[a-z_]+\]|#\[warn\(clippy::[a-z_]+' lints.txt | sort | uniq -c | sort -rn | head -30 \
            | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY || true
      - name: What the binary is made of
        run: |
          echo '### Largest functions and crates in the release binary' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo bloat --release -p djsugar --locked -n 25 >> $GITHUB_STEP_SUMMARY
          cargo bloat --release -p djsugar --locked --crates -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-lints
          path: lints.txt

  streaming:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live YouTube search and download from a clean network
        run: |
          mkdir -p yt
          cargo run --release --locked -p sugar-net --example youtube -- "daft punk around the world" yt 2>&1 | tee yt.log
          ls -la yt | tee -a yt.log
          echo '### YouTube live check' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 yt.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls yt/*.* > /dev/null 2>&1 || { echo "::warning::YouTube download failed, see the log"; }

  release:
    if: github.event_name == 'push'
    needs: [android, linux, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: djsugar-android
          path: out
      - name: Publish the nightly build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/djsugar.apk djsugar-android.apk
          gh release delete nightly -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create nightly -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            -t "Nightly ${GITHUB_SHA::7}" -n "Built from ${GITHUB_SHA::7} on the rust branch." djsugar-android.apk
