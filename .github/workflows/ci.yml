name: CI

# Pull requests run the Linux checks (format, clippy, tests), the dependency
# check, and the macOS app build so each pull request can be tried on a Mac.
# The Windows checks and the Windows app build run after a merge to main, or
# for any branch from the Actions tab (Run workflow).
# A merge queue (merge_group) would run the same Linux checks and the
# dependency check on the pull request rebased on the latest main, skipping
# the app builds, which run again after the merge. GitHub offers merge
# queues only to repositories owned by an organization, so this waits for
# that.
# Releases build every platform in release.yml.
on:
  push:
    branches: [main, rust]
    paths-ignore: ["website/**", "docs/**", "openspec/**", "**/*.md"]
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Pull requests that only touch docs skip the checks below. Skipping them
    # here instead of with paths-ignore lets them report as passed, so a
    # docs-only pull request isn't left waiting on required checks.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.code == 'true' }}
    steps:
      # The merge queue has no pull request to ask for its files, so it
      # compares the queued commit with the main it was rebased on.
      - uses: actions/checkout@v7
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          base: ${{ github.event.merge_group.base_sha }}
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!website/**"
              - "!docs/**"
              - "!openspec/**"
              - "!**/*.md"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # Line tables only: full debug info for the whole workspace fills the
      # runner's disk and memory while linking the test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space, add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a && sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
      - name: Install system libraries
        # mesa-vulkan-drivers provides lavapipe, a software Vulkan driver, so the
        # waveform shader test runs on CI machines without a GPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libasound2-dev libudev-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the check that docs/supported-controls.txt matches
      # `djsugar --list-controls` (control_list_tests in crates/app).
      # The app crate (with its generated UI) alone, so its library and test
      # builds don't run at the same time.
      - run: cargo test --workspace --exclude djsugar --no-run -j2
      - run: cargo test -p djsugar --no-run -j1
      # One crate at a time under a memory cap and a time limit, so a test
      # that runs away is stopped and named instead of taking the runner down.
      - name: cargo test
        timeout-minutes: 75
        run: |
          failed=""
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::$p"
            sudo systemd-run --scope --uid="$(id -u)" --gid="$(id -g)" -p MemoryMax=10G --setenv=PATH="$PATH" --setenv=HOME="$HOME" -q \
              timeout 20m cargo test -p "$p" -- --test-threads=2 || failed="$failed $p"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

  windows:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # Windows ships as a preview: the app must build and its tests pass there
    # too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dependencies:
    # Known vulnerabilities in dependencies, and licences that can't ship in a
    # GPL app (see deny.toml).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  macos-app:
    # Builds an unsigned DJSugar.app for Apple Silicon and attaches it to the run,
    # so the app can be tried without installing Rust.
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: macos-15
    # GitHub is short of Apple Silicon runners at times, and a job no runner
    # picks up within 15 minutes is cancelled ("not acquired by Runner"),
    # which failed the whole run on main. The job still shows red when it
    # fails, but no longer fails the run; release.yml builds the shipped app.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
      - run: cargo build --release -p djsugar -p djsugar-plugin-host
      # The version in Cargo.toml (what the app reports in Settings), with
      # the commit as the build, so About DJ Sugar says which build this is.
      - run: scripts/bundle-macos.sh target/release/djsugar "" "test build $(git rev-parse --short HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-macos
          path: dist/djsugar-macos.zip

  windows-app:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # The Windows setup and portable zip, attached to the run so the app can
    # be tried in a Windows VM without installing Rust.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust' }}
      - run: cargo build --release -p djsugar -p djsugar-plugin-host
      # The version in Cargo.toml, as the app reports it, so the setup and
      # Apps & features name the same version.
      - run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          scripts/bundle-windows.ps1 target/release/djsugar.exe $v
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: djsugar-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
