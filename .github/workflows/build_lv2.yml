name: Build LV2 Plugins

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "lib/calf-plugins/**"
      - "lib/dragonfly-reverb/**"
      - ".github/workflows/build_lv2.yml"
  pull_request:
    paths:
      - "lib/calf-plugins/**"
      - "lib/dragonfly-reverb/**"
      - ".github/workflows/build_lv2.yml"

jobs:
  build-lv2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libexpat1-dev \
            libglib2.0-dev \
            lv2-dev \
            liblilv-dev

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d /opt/
          mv /opt/android-ndk-r27c /opt/android-ndk
          rm ndk.zip
          echo "ANDROID_NDK_HOME=/opt/android-ndk" >> "$GITHUB_ENV"

      - name: Install LV2 headers into NDK sysroot
        run: |
          NDK_SYSROOT="/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # Copy LV2 and lilv headers to NDK sysroot
          mkdir -p "${NDK_SYSROOT}/usr/include"
          for src in /usr/include/lv2.h /usr/include/lv2 /usr/include/lilv-0; do
            if [ -e "$src" ]; then
              dest="${NDK_SYSROOT}/usr/include/$(basename "$src")"
              mkdir -p "$(dirname "$dest")"
              cp -r "$src" "$dest"
              echo "  Copied: $src -> $dest"
            fi
          done

      - name: Build LV2 plugins for Android ARM64
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
        run: |
          set -e
          PROJECT_ROOT="${{ github.workspace }}"
          BUILD_DIR="${PROJECT_ROOT}/build-lv2-android"
          ASSETS_DIR="${PROJECT_ROOT}/packaging/android/assets/lv2"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"
          mkdir -p "${ASSETS_DIR}"

          NDK="${ANDROID_NDK_HOME}"
          TOOLCHAIN="${NDK}/build/cmake/android.toolchain.cmake"
          ANDROID_ABI="arm64-v8a"
          ANDROID_PLATFORM="android-35"
          ANDROID_STL="c++_shared"
          JOBS=$(nproc)

          # NDK toolchain binaries for cross-compilation
          TC_PREFIX="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="${TC_PREFIX}/bin/aarch64-linux-android35-clang"
          export CXX="${TC_PREFIX}/bin/aarch64-linux-android35-clang++"
          export AR="${TC_PREFIX}/bin/llvm-ar"
          export RANLIB="${TC_PREFIX}/bin/llvm-ranlib"
          export STRIP="${TC_PREFIX}/bin/llvm-strip"

          # ---------------------------------------------------------------
          # 0. Build EXPAT for Android (required by Calf)
          # ---------------------------------------------------------------
          echo "=== Building EXPAT for Android ==="
          cd "${PROJECT_ROOT}"
          git clone --depth 1 https://github.com/libexpat/libexpat.git expat-src
          cd expat-src
          mkdir -p build-android && cd build-android
          cmake ../expat \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DANDROID_STL="${ANDROID_STL}" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${BUILD_DIR}/install/expat" \
            -DEXPAT_BUILD_EXAMPLES=OFF \
            -DEXPAT_BUILD_TESTS=OFF \
            -DEXPAT_SHARED_LIBS=ON
          cmake --build . --parallel "${JOBS}"
          cmake --install .

          # ---------------------------------------------------------------
          # 1. Calf Studio Gear (CMake-based)
          #    DJ-relevant: compressor, flanger, chorus, filter, delay,
          #    reverb, multiband compressor, limiter, deesser
          # ---------------------------------------------------------------
          echo "=== Building Calf Studio Gear (LV2 only) ==="
          cd "${PROJECT_ROOT}/lib/calf-plugins"
          mkdir -p build-android && cd build-android

          cmake .. \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DANDROID_STL="${ANDROID_STL}" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${BUILD_DIR}/install/calf-plugins" \
            -DWANT_GUI=OFF \
            -DWANT_JACK=OFF \
            -DWANT_LASH=OFF \
            -DWANT_LV2=ON \
            -DWANT_LV2_GUI=OFF \
            -DWANT_SORDI=OFF \
            -DWANT_EXPERIMENTAL=OFF \
            -DWANT_SSE=OFF \
            -DCMAKE_FIND_ROOT_PATH="${BUILD_DIR}/install/expat" \
            -DEXPAT_INCLUDE_DIR="${BUILD_DIR}/install/expat/include" \
            -DEXPAT_LIBRARY="${BUILD_DIR}/install/expat/lib/libexpat.so"

          cmake --build . --parallel "${JOBS}"
          cmake --install .

          # ---------------------------------------------------------------
          # 2. Dragonfly Reverb (DPF Makefile-based)
          #    Plugins: Hall, Plate, Room, Early Reflections
          # ---------------------------------------------------------------
          echo "=== Building Dragonfly Reverb ==="
          cd "${PROJECT_ROOT}/lib/dragonfly-reverb"

          # Build with DPF Makefile, cross-compiling via CC/CXX
          make -j"${JOBS}" \
            CC="${CC}" \
            CXX="${CXX}" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            STRIP="${STRIP}" \
            CFLAGS="--target=aarch64-linux-android35 -ffunction-sections -fdata-sections -fvisibility=hidden -O2" \
            CXXFLAGS="--target=aarch64-linux-android35 -ffunction-sections -fdata-sections -fvisibility=hidden -fvisibility-inlines-hidden -O2" \
            LDFLAGS="--target=aarch64-linux-android35 -Wl,--gc-sections,-O2,-s" \
            CROSS_COMPILING=true \
            plugins

          # Copy LV2 bundles to install dir (will be picked up by find below)
          mkdir -p "${BUILD_DIR}/install/dragonfly-reverb"
          for plugin in DragonflyHallReverb DragonflyRoomReverb \
                       DragonflyPlateReverb DragonflyEarlyReflections; do
            if [ -d "bin/${plugin}.lv2" ]; then
              cp -r "bin/${plugin}.lv2" "${BUILD_DIR}/install/dragonfly-reverb/${plugin}.lv2"
            fi
          done

          # ---------------------------------------------------------------
          # 3. LSP Plugins - SKIPPED (complex build system, add pre-built later)
          # ---------------------------------------------------------------
          echo "=== Skipping LSP Plugins (complex Makefile, use pre-built) ==="

          # ---------------------------------------------------------------
          # Bundle all LV2 plugins into assets directory
          # ---------------------------------------------------------------
          echo ""
          echo "=== Bundling LV2 plugins ==="
          find "${BUILD_DIR}/install" -name "*.lv2" -type d 2>/dev/null | while IFS= read -r bundle; do
            name="$(basename "${bundle}")"
            echo "  Bundling: ${name}"
            cp -r "${bundle}" "${ASSETS_DIR}/${name}"
          done

          echo ""
          echo "=== LV2 bundles created ==="
          ls -la "${ASSETS_DIR}/" 2>/dev/null || echo "  (none found)"

      - name: Build LV2 dependencies (lilv) for Android
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
        run: |
          set -e
          PROJECT_ROOT="${{ github.workspace }}"
          BUILD_DIR="${PROJECT_ROOT}/build-lv2-android"
          NDK="${ANDROID_NDK_HOME}"
          TOOLCHAIN="${NDK}/build/cmake/android.toolchain.cmake"
          TC_PREFIX="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="${TC_PREFIX}/bin/aarch64-linux-android35-clang"
          export CXX="${TC_PREFIX}/bin/aarch64-linux-android35-clang++"
          export AR="${TC_PREFIX}/bin/llvm-ar"
          export RANLIB="${TC_PREFIX}/bin/llvm-ranlib"
          export STRIP="${TC_PREFIX}/bin/llvm-strip"
          JOBS=$(nproc)
          LV2_INSTALL="${BUILD_DIR}/install/lv2-deps"
          mkdir -p "${LV2_INSTALL}"

          # Build serd
          echo "=== Building serd ==="
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/drobilla/serd.git /tmp/serd-src
          cd /tmp/serd-src
          mkdir -p build-android && cd build-android
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${LV2_INSTALL}" \
            -DSERD_BUILD_TESTS=OFF -DSERD_BUILD_DOCS=OFF
          cmake --build . --parallel "${JOBS}"
          cmake --install .

          # Build sord
          echo "=== Building sord ==="
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/drobilla/sord.git /tmp/sord-src
          cd /tmp/sord-src
          mkdir -p build-android && cd build-android
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${LV2_INSTALL}" \
            -DSORD_BUILD_TESTS=OFF -DSORD_BUILD_DOCS=OFF
          cmake --build . --parallel "${JOBS}"
          cmake --install .

          # Build sratom
          echo "=== Building sratom ==="
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/drobilla/sratom.git /tmp/sratom-src
          cd /tmp/sratom-src
          mkdir -p build-android && cd build-android
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${LV2_INSTALL}" \
            -DSRATOM_BUILD_TESTS=OFF
          cmake --build . --parallel "${JOBS}"
          cmake --install .

          # Build lilv
          echo "=== Building lilv ==="
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/drobilla/lilv.git /tmp/lilv-src
          cd /tmp/lilv-src
          mkdir -p build-android && cd build-android
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${LV2_INSTALL}" \
            -DLILV_BUILD_TESTS=OFF -DLILV_BUILD_DOCS=OFF \
            -DCMAKE_PREFIX_PATH="${LV2_INSTALL}"
          cmake --build . --parallel "${JOBS}"
          cmake --install .

          echo "=== LV2 dependencies built ==="
          ls -la "${LV2_INSTALL}/lib/"

      - name: Upload LV2 plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lv2-plugins-android-arm64
          path: |
            packaging/android/assets/lv2/
            build-lv2-android/install/lv2-deps/
          retention-days: 30
