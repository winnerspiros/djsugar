[package]
name = "sugar-ui"
description = "GPU renderer and widgets."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[lints]
workspace = true
