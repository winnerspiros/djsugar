[package]
name = "djsugar-controllers"
description = "MIDI and HID controller support driven by controller mappings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
djsugar-control = { path = "../control" }
djsugar-script = { path = "../script" }
base64 = "0.22"
midir = "0.11"
roxmltree = "0.21"
rquickjs = { version = "0.14", features = ["classes", "properties"] }
serde_json = "1"

[dev-dependencies]
djsugar-engine = { path = "../engine" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "linux")))'.dependencies]
# USB HID controllers on macOS and Windows (Linux reads hidraw directly);
# on macOS devices are opened shared,
# so another app can keep using them.
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
