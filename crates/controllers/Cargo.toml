[package]
name = "djsugar-controllers"
description = "MIDI and HID controller support driven by controller mappings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
djsugar-control = { path = "../control" }
djsugar-script = { path = "../script" }
base64 = "0.22"
midir = "0.11"
roxmltree = "0.21"
rquickjs = { version = "0.14", features = ["classes", "properties"] }
serde_json = "1"

[dev-dependencies]
djsugar-engine = { path = "../engine" }

[target.'cfg(not(target_os = "android"))'.dependencies]
# USB HID controllers (Native Instruments Traktor Kontrol and others). On
# Linux it uses hidraw through libudev; on macOS devices are opened shared,
# so another app can keep using them.
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw", "macos-shared-device"] }
