[package]
name = "djsugar-broadcast"
description = "Live broadcasting: encodes the master and streams it to Icecast and Shoutcast servers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
rusty_mp3 = "1.0"
ogg = "0.9"
djsugar-control = { path = "../control" }
rusty-opus = "1.1"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-roots = "1"
