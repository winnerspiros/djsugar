[package]
name = "djsugar-android"
description = "DJ Sugar's Android entry point"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true


[lib]
name = "djsugar_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
djsugar = { path = "../app", package = "djsugar" }
slint = { version = "~1.18", features = ["backend-android-activity-06"] }
jni = "0.21"
