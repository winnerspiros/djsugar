[package]
name = "sugar-net"
description = "Streaming services: search them and fetch their audio for the decks. Pure Rust, TLS included."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "json", "gzip"] }
webpki-root-certs = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
serde_json = "1"

[lints]
workspace = true
