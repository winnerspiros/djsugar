[package]
name = "sugar-net"
description = "Streaming services: search them and fetch their audio for the decks. Pure Rust, TLS included."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "json", "gzip"] }
webpki-root-certs = "1"
rustls-rustcrypto = "=0.1.0-pre.0"
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
serde_json = "1"
boa_engine = { version = "0.22", features = ["jsvalue-enum"] }

[lints]
workspace = true
