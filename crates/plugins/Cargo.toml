[package]
name = "djsugar-plugins"
description = "Plugins: store search (Bandcamp and links to other stores) and the purchase inbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
djsugar-engine = { path = "../engine" }
serde_json = "1"
md5 = "0.8"
ureq = { version = "3", features = ["json"] }
roxmltree = "0.21"
plist = { version = "1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rbox-masterdb = { version = "0.3.0", default-features = false }
rbox-anlz = "0.3.0"
rbox-core = "0.3.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
base64 = "0.22"
lofty = "0.25"
# Engine DJ's performance blobs are zlib.
flate2 = "1"

[dev-dependencies]
tempfile = "3"

# rekordbox's master.db is SQLCipher, built as in djsugar-export: on
# CommonCrypto on macOS, with OpenSSL built in elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
rbox-masterdb = { version = "0.3.0", default-features = false, features = ["bundled"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rbox-masterdb = { version = "0.3.0", default-features = false, features = ["bundled-vendored-openssl"] }