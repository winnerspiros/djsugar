[package]
name = "djsugar"
description = "DJ Sugar."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
sugar-layout = { path = "../layout" }
sugar-ui = { path = "../ui" }
sugar-engine = { path = "../engine" }
djsugar-engine = { path = "../port/engine" }
djsugar-control = { path = "../port/control" }
djsugar-controllers = { path = "../port/controllers" }
sugar-decode = { path = "../decode" }
sugar-analysis = { path = "../analysis" }
sugar-net = { path = "../net" }

[target.'cfg(target_os = "linux")'.dependencies]
sugar-shell = { path = "../shell" }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
jni = { version = "0.22", default-features = false }

[dev-dependencies]
png = { version = "0.18", default-features = false }

[lints]
workspace = true
