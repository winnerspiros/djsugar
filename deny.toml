# cargo-deny: checks dependencies for security advisories and for licences
# that can't be shipped inside a GPL application. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities and unmaintained direct dependencies. Each ignore
# says why it can't be fixed yet; remove it as soon as it can.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained with no successor; a required dependency of slint core" },
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite before 3.54: needs a crafted database and -wal pair opened locally; the fix (libsqlite3-sys 0.39) is blocked by rbox pinning =0.38 and diesel <0.39" },
]

[licenses]
# Everything here is compatible with distributing DJ Sugar under GPL-3.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "ISC",
    "LGPL-2.1-or-later",
    # LAME, the MP3 encoder for broadcasting.
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# mi-plaits-dsp (MIT) is only published on GitHub; Cargo.lock pins the commit.
allow-git = ["https://github.com/sourcebox/mi-plaits-dsp-rs"]
